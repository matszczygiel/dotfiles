[general]
import = ["~/.config/alacritty/dracula.toml"]

[colors]
draw_bold_text_with_bright_colors = false

[env]
TERM = "xterm-256color"

[font]
size = 9.5

# [font.italic]
# style = "SemiBold Italic"

[font.normal]
# family = "JetBrains Mono Nerd Font"
# style = "SemiBold"
# family = "FiraCode Nerd Font"
# family = "Hurmit Nerd Font"
family = "CaskaydiaCove Nerd Font"

[font.offset]
x = 0
y = 4

[window]
decorations = "full"
dynamic_title = true
startup_mode = "Windowed"
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 4
y = 4

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
